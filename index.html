<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Pelican Cruiser — 一只鹈鹕骑着薄荷绿复古自行车的可交互 3D 场景">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Pelican Cruiser · 鹈鹕的薄荷绿复古骑行</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="scene-root"></div>

<div class="hud">
  <header class="title-card">
    <h1>Pelican Cruiser</h1>
    <p>一只鹈鹕的薄荷绿复古骑行 · 3D 交互演示</p>
  </header>

  <div class="hint">拖动旋转 · 滚轮缩放 · 空格暂停 · R 重置视角</div>

  <div class="dock">
    <div class="panel speed-panel">
      <div class="speed-head"><span>骑行速度</span><output id="speedOut" for="speedSlider" aria-live="polite">19 km/h</output></div>
      <input id="speedSlider" type="range" min="0" max="100" step="1" value="55" aria-label="骑行速度">
    </div>
    <div class="panel buttons">
      <button id="btnPause" type="button" aria-pressed="false">暂停</button>
      <button id="btnOrbit" type="button" class="active" aria-pressed="true">自动环绕</button>
      <button id="btnReset" type="button">重置视角</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <span id="loadingText">正在准备骑行…</span>
</div>

<noscript><p style="font-family:sans-serif;padding:24px">需要启用 JavaScript 才能查看 3D 场景。</p></noscript>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="js/utils.js"></script>
<script src="js/env.js"></script>
<script src="js/bike.js"></script>
<script src="js/pelican.js"></script>
<script src="js/main.js"></script>
</body>
</html>
